name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release and upload assets

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags for the changelog

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # A manual run (no tag) builds a snapshot and keeps the binaries as a
      # workflow artifact; a tag push publishes a GitHub release.
      # The "## <tag>" section of CHANGELOG.md becomes the release description,
      # without one GoReleaser lists the commits since the last tag.
      - name: Extract release notes
        id: notes
        run: |
          awk -v tag="## ${GITHUB_REF_NAME}" '$0 == tag {found=1; next} /^## / {found=0} found' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ -n "$(tr -d '[:space:]' < "$RUNNER_TEMP/notes.md")" ]; then
            echo "args=--release-notes=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean ${{ github.ref_type != 'tag' && '--snapshot' || '' }} ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload snapshot artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: esm-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
